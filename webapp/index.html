<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #241C24;
    --canvas: #FAF6F3;
    --surface: #FFFFFF;
    --wine: #7A2E3D;
    --wine-dark: #5E2230;
    --gold: #B8935B;
    --line: #E6DAD2;
    --muted: #8A7E82;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding-bottom: 90px;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    padding: 20px 16px 12px;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    margin: 0 0 2px;
  }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 16px 16px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 13px;
    color: var(--ink);
    white-space: nowrap;
  }
  .chip.active { background: var(--wine); color: #fff; border-color: var(--wine); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px;
  }
  .card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }
  .card .photo {
    width: 100%;
    aspect-ratio: 3/4;
    background: #EFE7E1 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23EFE7E1"/></svg>') center/cover;
    object-fit: cover;
  }
  .card .info { padding: 10px 10px 12px; }
  .card .name { font-size: 13.5px; font-weight: 500; line-height: 1.3; margin: 0 0 4px; }
  .card .price { font-family: 'Fraunces', serif; font-size: 16px; color: var(--wine-dark); margin: 0 0 8px; }
  .card button.pick {
    width: 100%;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--wine);
    background: transparent;
    color: var(--wine);
    font-size: 12.5px;
    font-weight: 600;
  }
  .card.out .photo { opacity: 0.5; }
  .card.out button.pick { border-color: var(--muted); color: var(--muted); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* Cart bar */
  .cartbar {
    position: fixed;
    left: 12px; right: 12px; bottom: 12px;
    background: var(--wine);
    color: #fff;
    border-radius: 14px;
    padding: 14px 18px;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(122,46,61,0.35);
  }
  .cartbar.show { display: flex; }

  /* Bottom sheet */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(36,28,36,0.45);
    display: none;
    z-index: 50;
  }
  .sheet-overlay.show { display: block; }
  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    max-height: 85vh;
    overflow-y: auto;
    padding: 18px 18px 24px;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  .sheet-overlay.show .sheet { transform: translateY(0); }
  .sheet h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 20px; margin: 0 0 14px; }
  .sheet-close {
    position: absolute; top: 14px; right: 16px;
    border: none; background: none; font-size: 20px; color: var(--muted);
  }

  .option-group { margin-bottom: 14px; }
  .option-group .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .option-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .option-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 13px;
  }
  .option-btn.active { border-color: var(--wine); background: var(--wine); color: #fff; }
  .option-btn:disabled { opacity: 0.4; }

  .qty-row { display: flex; align-items: center; gap: 14px; margin: 16px 0; }
  .qty-row button {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); font-size: 16px;
  }

  .primary-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--wine);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
  }
  .primary-btn:disabled { background: var(--line); color: var(--muted); }

  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .cart-item .meta { color: var(--muted); font-size: 12px; }
  .cart-item .qty-mini { display: flex; align-items: center; gap: 8px; }
  .cart-item .qty-mini button {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: #fff;
  }

  .cart-total {
    display: flex; justify-content: space-between; font-weight: 600;
    padding: 14px 0; font-family: 'Fraunces', serif; font-size: 17px;
  }

  input.field {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea.field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; margin-bottom: 10px; font-family: inherit; resize: none; }
</style>
</head>
<body>

<header>
  <h1>Каталог</h1>
  <p>Выбирайте — мы свяжемся с вами для подтверждения заказа</p>
</header>

<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">Товары скоро появятся</div>

<div class="cartbar" id="cartbar" onclick="openCart()">
  <span id="cartCount">0 товаров</span>
  <span id="cartTotal">0 ₽</span>
</div>

<!-- Sheet: выбор варианта товара -->
<div class="sheet-overlay" id="variantOverlay">
  <div class="sheet">
    <button class="sheet-close" onclick="closeSheet('variantOverlay')">✕</button>
    <h2 id="vProductName"></h2>
    <div class="option-group">
      <div class="label">Размер</div>
      <div class="option-row" id="sizeOptions"></div>
    </div>
    <div class="option-group">
      <div class="label">Цвет</div>
      <div class="option-row" id="colorOptions"></div>
    </div>
    <div class="qty-row">
      <button onclick="changeQty(-1)">−</button>
      <span id="qtyValue">1</span>
      <button onclick="changeQty(1)">+</button>
      <span id="stockNote" style="color:var(--muted); font-size:12px; margin-left:8px;"></span>
    </div>
    <button class="primary-btn" id="addToCartBtn" onclick="addToCart()">Добавить в корзину</button>
  </div>
</div>

<!-- Sheet: корзина -->
<div class="sheet-overlay" id="cartOverlay">
  <div class="sheet">
    <button class="sheet-close" onclick="closeSheet('cartOverlay')">✕</button>
    <h2>Ваш заказ</h2>
    <div id="cartItems"></div>
    <div class="cart-total"><span>Итого</span><span id="cartTotalSum">0 ₽</span></div>
    <input class="field" id="custName" placeholder="Ваше имя">
    <input class="field" id="custPhone" placeholder="Телефон для связи *" required>
    <textarea class="field" id="custComment" rows="2" placeholder="Комментарий (необязательно)"></textarea>
    <button class="primary-btn" id="submitOrderBtn" onclick="submitOrder()">Оформить заказ</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let products = [];
let categories = [];
let activeCategory = null;
let cart = []; // {variant_id, product_id, name, size, color, price, qty, maxStock}

let currentProduct = null;
let selectedSize = null;
let selectedColor = null;
let currentQty = 1;

async function loadData() {
  const [prodRes, catRes] = await Promise.all([
    fetch('/api/products'),
    fetch('/api/products/categories')
  ]);
  products = await prodRes.json();
  categories = await catRes.json();
  renderChips();
  renderGrid();
}

function renderChips() {
  const chips = document.getElementById('chips');
  const all = [{ id: null, name: 'Все' }, ...categories];
  chips.innerHTML = all.map(c =>
    `<button class="chip ${activeCategory === c.id ? 'active' : ''}" onclick="selectCategory(${c.id})">${c.name}</button>`
  ).join('');
}

function selectCategory(id) {
  activeCategory = id;
  renderChips();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  let list = products;
  if (activeCategory !== null) list = list.filter(p => p.category_id === activeCategory);

  if (!list.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = list.map(p => {
    const totalStock = p.variants.reduce((s, v) => s + v.stock_qty, 0);
    const outOfStock = totalStock <= 0;
    return `
      <div class="card ${outOfStock ? 'out' : ''}">
        <img class="photo" src="${p.photo_url || ''}" onerror="this.style.background='#EFE7E1'; this.src='';">
        <div class="info">
          <p class="name">${p.name}</p>
          <p class="price">${p.price} ₽</p>
          <button class="pick" ${outOfStock ? 'disabled' : ''} onclick="openVariantPicker(${p.id})">
            ${outOfStock ? 'Нет в наличии' : 'Выбрать'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function openVariantPicker(productId) {
  currentProduct = products.find(p => p.id === productId);
  selectedSize = null;
  selectedColor = null;
  currentQty = 1;
  document.getElementById('vProductName').textContent = currentProduct.name;
  document.getElementById('qtyValue').textContent = currentQty;

  const sizes = [...new Set(currentProduct.variants.map(v => v.size))];
  const colors = [...new Set(currentProduct.variants.map(v => v.color))];

  document.getElementById('sizeOptions').innerHTML = sizes.map(s =>
    `<button class="option-btn" data-size="${s}" onclick="pickSize('${s}')">${s}</button>`
  ).join('');
  document.getElementById('colorOptions').innerHTML = colors.map(c =>
    `<button class="option-btn" data-color="${c}" onclick="pickColor('${c}')">${c}</button>`
  ).join('');

  updateStockNote();
  openSheet('variantOverlay');
}

function pickSize(s) {
  selectedSize = s;
  document.querySelectorAll('#sizeOptions .option-btn').forEach(b => b.classList.toggle('active', b.dataset.size === s));
  updateStockNote();
}
function pickColor(c) {
  selectedColor = c;
  document.querySelectorAll('#colorOptions .option-btn').forEach(b => b.classList.toggle('active', b.dataset.color === c));
  updateStockNote();
}

function findVariant() {
  if (!currentProduct || !selectedSize || !selectedColor) return null;
  return currentProduct.variants.find(v => v.size === selectedSize && v.color === selectedColor) || null;
}

function updateStockNote() {
  const v = findVariant();
  const note = document.getElementById('stockNote');
  const btn = document.getElementById('addToCartBtn');
  if (!v) { note.textContent = ''; btn.disabled = false; return; }
  note.textContent = v.stock_qty > 0 ? `в наличии: ${v.stock_qty}` : 'нет в наличии';
  btn.disabled = v.stock_qty <= 0;
  if (currentQty > v.stock_qty) { currentQty = Math.max(1, v.stock_qty); document.getElementById('qtyValue').textContent = currentQty; }
}

function changeQty(delta) {
  const v = findVariant();
  const max = v ? v.stock_qty : 99;
  currentQty = Math.min(max, Math.max(1, currentQty + delta));
  document.getElementById('qtyValue').textContent = currentQty;
}

function addToCart() {
  const v = findVariant();
  if (!v || v.stock_qty <= 0) return;
  const existing = cart.find(i => i.variant_id === v.id);
  if (existing) {
    existing.qty = Math.min(v.stock_qty, existing.qty + currentQty);
  } else {
    cart.push({
      variant_id: v.id,
      product_id: currentProduct.id,
      name: currentProduct.name,
      size: v.size,
      color: v.color,
      price: currentProduct.price,
      qty: currentQty,
      maxStock: v.stock_qty
    });
  }
  closeSheet('variantOverlay');
  renderCartBar();
  tg?.HapticFeedback?.notificationOccurred('success');
}

function renderCartBar() {
  const bar = document.getElementById('cartbar');
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const total = cart.reduce((s, i) => s + i.qty * i.price, 0);
  if (count > 0) {
    bar.classList.add('show');
    document.getElementById('cartCount').textContent = `${count} товар(ов)`;
    document.getElementById('cartTotal').textContent = `${total} ₽`;
  } else {
    bar.classList.remove('show');
  }
}

function openCart() {
  renderCartItems();
  openSheet('cartOverlay');
}

function renderCartItems() {
  const container = document.getElementById('cartItems');
  if (!cart.length) {
    container.innerHTML = '<p style="color:var(--muted); font-size:13px;">Корзина пуста</p>';
  } else {
    container.innerHTML = cart.map((item, idx) => `
      <div class="cart-item">
        <div>
          <div>${item.name}</div>
          <div class="meta">${item.size}, ${item.color} · ${item.price} ₽</div>
        </div>
        <div class="qty-mini">
          <button onclick="cartQty(${idx}, -1)">−</button>
          <span>${item.qty}</span>
          <button onclick="cartQty(${idx}, 1)">+</button>
        </div>
      </div>
    `).join('');
  }
  const total = cart.reduce((s, i) => s + i.qty * i.price, 0);
  document.getElementById('cartTotalSum').textContent = `${total} ₽`;
}

function cartQty(idx, delta) {
  const item = cart[idx];
  item.qty = Math.min(item.maxStock, Math.max(0, item.qty + delta));
  if (item.qty === 0) cart.splice(idx, 1);
  renderCartItems();
  renderCartBar();
}

async function submitOrder() {
  const phone = document.getElementById('custPhone').value.trim();
  if (!phone) { document.getElementById('custPhone').focus(); return; }
  if (!cart.length) return;

  const btn = document.getElementById('submitOrderBtn');
  btn.disabled = true;
  btn.textContent = 'Отправляем...';

  const user = tg?.initDataUnsafe?.user;
  const payload = {
    customer_tg_id: user?.id ? String(user.id) : null,
    customer_name: document.getElementById('custName').value.trim() || (user ? `${user.first_name || ''} ${user.last_name || ''}`.trim() : ''),
    customer_phone: phone,
    customer_comment: document.getElementById('custComment').value.trim(),
    items: cart.map(i => ({ variant_id: i.variant_id, qty: i.qty }))
  };

  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка оформления заказа');

    cart = [];
    renderCartBar();
    closeSheet('cartOverlay');
    tg?.HapticFeedback?.notificationOccurred('success');
    tg?.showAlert ? tg.showAlert(`Заказ №${data.id} оформлен! Мы свяжемся с вами.`) : alert(`Заказ №${data.id} оформлен!`);
    loadData();
  } catch (e) {
    tg?.showAlert ? tg.showAlert(e.message) : alert(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Оформить заказ';
  }
}

function openSheet(id) { document.getElementById(id).classList.add('show'); }
function closeSheet(id) { document.getElementById(id).classList.remove('show'); }

document.querySelectorAll('.sheet-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });
});

loadData();
</script>
</body>
</html>
